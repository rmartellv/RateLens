  }

    font-family:'Newsreader', serif;
    font-style: italic;
    font-size: 22px;
    font-weight: 500;
    color: var(--nav-text-active);
  }
  .nav-brand span{ color: var(--accent-light); font-style: normal; }
  .nav-links{ display:flex; flex-direction:column; gap: 4px; }

    padding: 10px 12px;

    font-size: 13.5px;

    border-left: 2px solid transparent;
    cursor: pointer;
    user-select: none;

  .nav-link:hover{ color: var(--nav-text-active); }
  .nav-link.active{

<script>
/* =========================================================================
   RATELENS — CALC LAYER
   Pure functions from ratelens-bond-valuation, ratelens-yield-curve,
   ratelens-macro-rate-drivers. Verified via node before embedding here —
   the yield-curve bootstrap had a dollar-coupon scaling bug in the first
   draft (caught during testing) and is fixed in this version.
   ========================================================================= */

function cashFlows(faceValue, couponRate, freq, periodsToMaturity) {
  const coupon = (couponRate * faceValue) / freq;
  const flows = new Array(periodsToMaturity).fill(coupon);
  flows[periodsToMaturity - 1] += faceValue;
  return flows;
}
function priceFromYield(faceValue, couponRate, freq, periodsToMaturity, yieldPerPeriod) {
  const flows = cashFlows(faceValue, couponRate, freq, periodsToMaturity);
  return flows.reduce((pv, cf, i) => pv + cf / Math.pow(1 + yieldPerPeriod, i + 1), 0);
}
function yieldFromPrice(faceValue, couponRate, freq, periodsToMaturity, marketPrice, guess = 0.05) {
  const f = (y) => priceFromYield(faceValue, couponRate, freq, periodsToMaturity, y / freq) - marketPrice;
  let y = guess, h = 1e-6;
  for (let i = 0; i < 50; i++) {
    const fy = f(y);
    const dfy = (f(y + h) - f(y - h)) / (2 * h);
    if (Math.abs(dfy) < 1e-10) break;
    const yNext = y - fy / dfy;
    if (Math.abs(yNext - y) < 1e-8) return yNext;
    y = yNext;
  }
  let lo = -0.5, hi = 5.0;
  for (let i = 0; i < 200; i++) {
    const mid = (lo + hi) / 2;
    if (f(lo) * f(mid) <= 0) hi = mid; else lo = mid;
  }
  return (lo + hi) / 2;
}
function accruedInterest(faceValue, couponRate, freq, daysSinceLastCoupon, daysInPeriod) {
  const couponAmt = (couponRate * faceValue) / freq;
  return couponAmt * (daysSinceLastCoupon / daysInPeriod);
}
function macaulayDuration(faceValue, couponRate, freq, periodsToMaturity, yieldPerPeriod) {
  const flows = cashFlows(faceValue, couponRate, freq, periodsToMaturity);
  const price = flows.reduce((pv, cf, i) => pv + cf / Math.pow(1 + yieldPerPeriod, i + 1), 0);
  const weightedT = flows.reduce((sum, cf, i) => {
    const t = i + 1;
    return sum + (t * cf) / Math.pow(1 + yieldPerPeriod, t);
  }, 0);
  return (weightedT / price) / freq;
}
function modifiedDuration(macD, yieldPerPeriod, freq) { return macD / (1 + yieldPerPeriod / freq); }
function dv01(modD, price) { return modD * price * 0.0001; }
function convexity(faceValue, couponRate, freq, periodsToMaturity, yieldPerPeriod) {
  const flows = cashFlows(faceValue, couponRate, freq, periodsToMaturity);
  const price = flows.reduce((pv, cf, i) => pv + cf / Math.pow(1 + yieldPerPeriod, i + 1), 0);
  const sum = flows.reduce((acc, cf, i) => {
    const t = i + 1;
    return acc + (t * (t + 1) * cf) / Math.pow(1 + yieldPerPeriod, t + 2);
  }, 0);
  return (sum / price) / (freq * freq);
}
function discountYieldToBEY(d, daysToMaturity) { return (365 * d) / (360 - d * daysToMaturity); }

function interpolateLinear(maturities, yields, target) {
  if (target <= maturities[0]) return yields[0];
  if (target >= maturities[maturities.length - 1]) return yields[yields.length - 1];
  for (let i = 0; i < maturities.length - 1; i++) {
    const t0 = maturities[i], t1 = maturities[i + 1];
    if (target >= t0 && target <= t1) {
      const w = (target - t0) / (t1 - t0);
      return yields[i] + w * (yields[i + 1] - yields[i]);
    }
  }
}
function bootstrapSpotCurve(maturities, parYields, faceValue = 100) {
  const zeros = [];
  for (let i = 0; i < maturities.length; i++) {
    const n = maturities[i];
    const couponDollar = parYields[i] * faceValue;
    if (i === 0) { zeros.push(parYields[i]); continue; }
    let pvCoupons = 0;
    for (let t = 1; t < n; t++) {
      const zt = interpolateLinear(maturities.slice(0, i + 1), zeros.concat([parYields[i]]), t);
      pvCoupons += couponDollar / Math.pow(1 + zt, t);
    }
    const target = faceValue - pvCoupons;
    const zn = Math.pow((faceValue + couponDollar) / target, 1 / n) - 1;
    zeros.push(zn);
  }
  return zeros;
}
function forwardRate(t1, t2, zeroRateFn) {
  const z1 = zeroRateFn(t1), z2 = zeroRateFn(t2);
  return Math.pow(Math.pow(1 + z2, t2) / Math.pow(1 + z1, t1), 1 / (t2 - t1)) - 1;
}
function zSpread(times, amounts, zeroRateFn, marketPrice) {
  const priceAt = (z) => times.reduce((pv, t, i) => pv + amounts[i] / Math.pow(1 + zeroRateFn(t) + z, t), 0);
  let lo = -0.05, hi = 0.20;
  for (let i = 0; i < 100; i++) {
    const mid = (lo + hi) / 2;
    const diff = priceAt(mid) - marketPrice, diffLo = priceAt(lo) - marketPrice;
    if (diffLo * diff <= 0) hi = mid; else lo = mid;
  }
  return (lo + hi) / 2;
}
function curveShape(y) {
  return {
    spread2s10s: y['10Y'] - y['2Y'],
    spread3m10y: y['10Y'] - y['3M'],
    butterfly: 2 * y['5Y'] - y['2Y'] - y['10Y'],
  };
}
function priceImpactFromYieldShock(modD, conv, deltaY) { return -modD * deltaY + 0.5 * conv * deltaY * deltaY; }

/**
 * Carry & roll-down: what a bond earns just from being held, over `horizonYears`, assuming the
 * curve itself stays static (the standard convention). Two pieces:
 *  - couponCarry: coupon income accrued over the horizon, as % of face.
 *  - rollReturn: price gain from the bond "rolling down" to a shorter maturity on today's curve
 *    (par bonds' yields fall as maturity shortens on an upward-sloping curve -> price rises).
 * `spreadOverCurve` holds the bond's own credit spread constant while rolling it down the
 * benchmark curve — skipping this for a corporate bond understates its "rolled-to" yield and
 * wildly overstates roll return, since it would be rolling down the government curve instead of
 * the bond's own curve.
 */
function carryRollDown(faceValue, couponRate, freq, years, price, horizonYears, curveInterpFn, spreadOverCurve = 0) {
  const couponCarry = couponRate * horizonYears;
  const newMaturity = Math.max(0.01, years - horizonYears);
  const rolledYield = curveInterpFn(newMaturity) + spreadOverCurve;
  const remainingPeriods = Math.max(1, Math.round(newMaturity * freq));
  const rolledPrice = priceFromYield(faceValue, couponRate, freq, remainingPeriods, rolledYield / freq);
  const rollReturn = (rolledPrice - price) / price;
  return { couponCarry, rollReturn, totalCarryRoll: couponCarry + rollReturn, rolledYield, newMaturity };
}

/**
 * Key rate duration via cashflow mapping: each cashflow's Macaulay-duration contribution (t_years * PV)
 * is split between the two key-rate nodes that bracket its timing (linear/"hat" weighting), then the
 * whole node-share vector is scaled so it sums exactly to the bond's already-computed modified duration.
 * This is the standard practitioner shortcut for approximate KRD without rebuilding a full curve Jacobian
 * (RiskMetrics/Barra-style cashflow mapping) — and scaling to match b.modD exactly (rather than deriving
 * modified duration independently here) guarantees this reconciles with the duration shown elsewhere on
 * the platform, which matters more for a demo than which of two equally standard conventions was used.
 */
function keyRateDuration(faceValue, couponRate, freq, years, price, ytm, modD, nodes) {
  const n = years * freq;
  const flows = cashFlows(faceValue, couponRate, freq, n);
  const yPerPeriod = ytm / freq;
  const nodeContrib = new Array(nodes.length).fill(0);
  let totalContrib = 0;
  flows.forEach((cf, i) => {
    const period = i + 1;
    const tYears = period / freq;
    const pv = cf / Math.pow(1 + yPerPeriod, period);
    const contrib = tYears * pv;
    totalContrib += contrib;
    if (tYears <= nodes[0]) { nodeContrib[0] += contrib; return; }
    if (tYears >= nodes[nodes.length - 1]) { nodeContrib[nodes.length - 1] += contrib; return; }
    for (let k = 0; k < nodes.length - 1; k++) {
      if (tYears >= nodes[k] && tYears <= nodes[k + 1]) {
        const w = (tYears - nodes[k]) / (nodes[k + 1] - nodes[k]);
        nodeContrib[k] += (1 - w) * contrib;
        nodeContrib[k + 1] += w * contrib;
        break;
      }
    }
  });
  return nodeContrib.map(c => (c / totalContrib) * modD);
}

/** Same mapping for a single zero-coupon cashflow (T-bill) — all duration sits at one maturity point,
    split across its two bracketing nodes the same way. */
function keyRateDurationZero(maturityYears, modD, nodes) {
  const krd = new Array(nodes.length).fill(0);
  if (maturityYears <= nodes[0]) { krd[0] = modD; return krd; }
  if (maturityYears >= nodes[nodes.length - 1]) { krd[nodes.length - 1] = modD; return krd; }
  for (let k = 0; k < nodes.length - 1; k++) {
    if (maturityYears >= nodes[k] && maturityYears <= nodes[k + 1]) {
      const w = (maturityYears - nodes[k]) / (nodes[k + 1] - nodes[k]);
      krd[k] = (1 - w) * modD;
      krd[k + 1] = w * modD;
      break;
    }
  }
  return krd;
}

/**
 * Multi-factor curve risk model — Level / Slope / Curvature / Spread, the standard PCA-style curve
 * factor decomposition real risk systems (Bloomberg MAC3, Aladdin) use instead of naively summing
 * individual bond risks. Level/Slope/Curvature are constructed to be approximately orthogonal, which
 * is why their pairwise correlations below are ~0 — that's not an assumption of convenience, it's how
 * real PCA-derived curve factors are built. Spread carries a small negative correlation to Level
 * (flight-to-quality: spreads often widen when rates fall sharply in a stress regime) — illustrative,
 * but the sign and the reasoning are real, not arbitrary.
 */
/** precomputedKrd is optional — pass the same array krdForInstrument(b, krdNodes) would return if
    it's already been computed elsewhere this render pass (Portfolio & Risk builds it once and shares
    it across the KRD table, the factor model, and Monte Carlo, instead of each recomputing the
    cashflow-mapping from scratch). Falls back to computing it fresh if not provided. */
function bondFactorExposures(b, krdNodes, precomputedKrd){
  // Level = total modified duration (same convention as portfolio DV01 elsewhere on the platform).
  const level = b.modD;
  const krd = precomputedKrd || krdForInstrument(b, krdNodes);
  // krdNodes = [0.25, 0.5, 1, 2, 5, 10, 30] -> indices: short=[0,1,2,3], pivot=4 (5Y), long=[5,6]
  const shortDur = krd[0] + krd[1] + krd[2] + krd[3];
  const longDur = krd[5] + krd[6];
  const slope = longDur - shortDur; // positive = benefits from a flattener (long rallies vs short), negative = benefits from a steepener
  const curvature = 2*krd[4] - krd[3] - krd[5]; // butterfly convention, matches curveShape() elsewhere
  const spread = (b.type === 'Corporate') ? b.modD : 0; // simplification: every corporate assumed equally sensitive to one common spread factor (beta=1) — a real model would give HY names a higher beta than IG
  return { level, slope, curvature, spread };
}

const FACTOR_NAMES = ['level','slope','curvature','spread'];
// Daily factor vols (bp) — Level reuses DAILY_YIELD_VOL already assumed elsewhere on the platform for
// consistency; Slope/Curvature/Spread are illustrative but ordered the way real curve factors actually
// behave (level moves most, curvature least). No free live source for a real factor covariance matrix.
const FACTOR_VOL_BP = { level: 5, slope: 3, curvature: 2, spread: 4 };
const FACTOR_CORR = {
  level:     { level:1,    slope:0,    curvature:0, spread:-0.2 },
  slope:     { level:0,    slope:1,    curvature:0, spread:0.1  },
  curvature: { level:0,    slope:0,    curvature:1, spread:0    },
  spread:    { level:-0.2, slope:0.1,  curvature:0, spread:1    },
};

/** holdingsKRD (optional): { bondId: krdArray }, shared with the KRD table section so the cashflow
    mapping runs once per bond per render instead of once per section that needs it. */
function portfolioFactorExposures(krdNodes, holdingsKRD){
  const exp = { level:0, slope:0, curvature:0, spread:0 };
  ALL_INSTRUMENTS.forEach(b=>{
    const w = portfolioWeights[b.id];
    if(w === undefined) return;
    const fe = bondFactorExposures(b, krdNodes, holdingsKRD && holdingsKRD[b.id]);
    FACTOR_NAMES.forEach(f => exp[f] += w * fe[f]);
  });
  return exp;
}

/** Computes key rate duration once per current portfolio holding — shared by the KRD table, the
    factor model, and Monte Carlo, all of which otherwise independently re-run the same cashflow
    mapping for the same bonds within a single Portfolio & Risk render. */
function computeHoldingsKRD(krdNodes){
  const map = {};
  ALL_INSTRUMENTS.forEach(b=>{
    if(portfolioWeights[b.id] === undefined) return;
    map[b.id] = krdForInstrument(b, krdNodes);
  });
  return map;
}

/** Diversified portfolio risk via w'Σw, vs. a naive sum assuming perfect correlation across factors —
    the gap between the two IS the diversification benefit, shown explicitly rather than asserted. */
function factorPortfolioRisk(exposures){
  let variance = 0;
  FACTOR_NAMES.forEach(fi=>{
    FACTOR_NAMES.forEach(fj=>{
      const covBp = FACTOR_VOL_BP[fi] * FACTOR_VOL_BP[fj] * FACTOR_CORR[fi][fj]; // bp^2
      variance += exposures[fi] * exposures[fj] * covBp / 10000 / 10000; // exposures are $/100face/bp, covBp in bp^2 -> convert to (1bp)^2 units consistently
    });
  });
  const diversifiedStd = Math.sqrt(Math.max(0,variance)); // $ per 100 face, 1-day std dev
  const naiveSum = FACTOR_NAMES.reduce((s,f)=> s + Math.abs(exposures[f]) * FACTOR_VOL_BP[f]/10000, 0);
  return { diversifiedStd, naiveSum, diversificationBenefit: naiveSum > 0 ? (1 - diversifiedStd/naiveSum) : 0 };
}

/* =========================================================================
   MONTE CARLO / FAT-TAILED VaR — draws correlated factor shocks from the SAME factor model above via
   Cholesky decomposition, so this isn't a separate risk framework bolted on — it's what the factor
   model implies once you simulate it instead of solving it in closed form. Seeded PRNG so results are
   reproducible run to run unless the user explicitly re-runs.
   ========================================================================= */
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function boxMuller(rng){
  const u1 = Math.max(1e-12, rng()), u2 = rng();
  return Math.sqrt(-2*Math.log(u1)) * Math.cos(2*Math.PI*u2);
}
/** Cholesky decomposition for the small 4x4 correlation matrix — standard method for turning
    independent normal draws into correlated ones (L * z = correlated draw, Sigma = L*L'). */
function choleskyFactor(){
  const n = FACTOR_NAMES.length;
  const A = FACTOR_NAMES.map(fi => FACTOR_NAMES.map(fj => FACTOR_CORR[fi][fj]));
  const L = Array.from({length:n}, () => new Array(n).fill(0));
  for(let i=0;i<n;i++){
    for(let j=0;j<=i;j++){
      let sum = 0;
      for(let k=0;k<j;k++) sum += L[i][k]*L[j][k];
      if(i===j) L[i][j] = Math.sqrt(Math.max(0, A[i][i]-sum));
      else L[i][j] = (A[i][j]-sum) / (L[j][j] || 1e-9);
    }
  }
  return L;
}
/** Runs nPaths simulations of correlated factor shocks, returns sorted portfolio $ P&L array.
    fatTailed=true mixes in an occasional amplified draw (scale mixture of normals) — a simple, honest
    way to fatten tails without a full Student-t sampler, and the point (tails matter) comes through
    either way. */
function runMonteCarloVar(exposures, nPaths, seed, fatTailed){
  const rng = mulberry32(seed);
  const L = choleskyFactor();
  const n = FACTOR_NAMES.length;
  const pnls = [];
  for(let p=0; p<nPaths; p++){
    const z = FACTOR_NAMES.map(()=>boxMuller(rng));
    let tailMult = 1;
    if(fatTailed && rng() < 0.05) tailMult = 3 + rng()*2; // ~5% chance of a 3-5x amplified shock
    const corrShocksBp = new Array(n).fill(0);
    for(let i=0;i<n;i++){
      let s = 0;
      for(let k=0;k<=i;k++) s += L[i][k]*z[k];
      corrShocksBp[i] = s * FACTOR_VOL_BP[FACTOR_NAMES[i]] * tailMult;
    }
    let fractionalReturn = 0;
    FACTOR_NAMES.forEach((f,i)=>{ fractionalReturn += -exposures[f] * corrShocksBp[i]/10000; });
    pnls.push(fractionalReturn * portfolioValue);
  }
  pnls.sort((a,b)=>a-b);
  const pct = (p) => pnls[Math.max(0, Math.min(pnls.length-1, Math.floor(p*pnls.length)))];
  const var95 = -pct(0.05), var99 = -pct(0.01);
  const worst5pct = pnls.slice(0, Math.max(1,Math.floor(0.05*pnls.length)));
  const cvar95 = -(worst5pct.reduce((a,b)=>a+b,0)/worst5pct.length);
  return { var95, var99, cvar95, pnls };
}

/**
 * Return attribution — the CFA-standard carry / curve / spread decomposition. Reuses carryRollDown for
 * the carry+roll leg and the existing duration/convexity price-impact formula for the other two legs,
 * so this is entirely a re-stitching of calc already in the platform, not a new pricing model.
 */
function returnAttribution(b, horizonYears, curveShockY, spreadShockY) {
  const carry = carryRollDown(b.face, b.coupon, b.freq, b.years, b.price, horizonYears, parCurveFn, b.nominalSpread);
  const curveEffect = priceImpactFromYieldShock(b.modD, b.conv, curveShockY);
  const spreadEffect = priceImpactFromYieldShock(b.modD, 0, spreadShockY);
  const total = carry.totalCarryRoll + curveEffect + spreadEffect;
  return { carry: carry.totalCarryRoll, curveEffect, spreadEffect, total, carryDetail: carry };
}

  if (b.type === 'Bill') return keyRateDurationZero(b.daysToMaturity / 365, b.modD, nodes);
  return keyRateDuration(b.face, b.coupon, b.freq, b.years, b.price, b.ytm, b.modD, nodes);
}

/* =========================================================================
   RENDER — CURVE SVG (shared by dashboard + curve page)
   ========================================================================= */
function curveSvg(showZero){
  const w=440, h=230, padL=34, padR=14, padT=14, padB=26;
  const minY = 3.0, maxY = 6.2; // %
  const xFor = (i,n) => padL + (i/(n-1))*(w-padL-padR);
  const yFor = (yieldPct) => padT + (1 - (yieldPct-minY)/(maxY-minY))*(h-padT-padB);

  const parPts = CURVE_YIELDS.map((y,i)=>[xFor(i,CURVE_YIELDS.length), yFor(y*100)]);
  const parLine = parPts.map(p=>p.join(',')).join(' ');

  let zeroLine = '';
  if(showZero){
    const zeroPts = CURVE_LABELS.map((l,i)=>[xFor(i,CURVE_LABELS.length), yFor(zeroRateFn(CURVE_TENOR_YEARS[l])*100)]);
    zeroLine = zeroPts.map(p=>p.join(',')).join(' ');
  }

  let gridlines = '';
  [3,4,5,6].forEach(v=>{
    const y = yFor(v);
    gridlines += `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="#DCD0BC" stroke-width="1" stroke-dasharray="${v===3?'0':'4 4'}"/>`;
    gridlines += `<text x="6" y="${y+4}" fill="#6B6156" font-size="10">${v}%</text>`;
  });
  let xlabels = '';
  CURVE_LABELS.forEach((l,i)=>{
    const x = xFor(i, CURVE_LABELS.length);
    xlabels += `<text x="${x-10}" y="${h-8}" fill="#6B6156" font-size="10">${l}</text>`;
  });
  let parDots = parPts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.2" fill="#8F5A39"/>`).join('');
  let zeroDots = showZero ? CURVE_LABELS.map((l,i)=>{
    const x = xFor(i, CURVE_LABELS.length), y = yFor(zeroRateFn(CURVE_TENOR_YEARS[l])*100);
    return `<circle cx="${x}" cy="${y}" r="3" fill="#4F9FC7"/>`;
  }).join('') : '';

  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    ${gridlines}
    <polyline points="${parLine}" fill="none" stroke="#8F5A39" stroke-width="2.4"/>
    ${showZero ? `<polyline points="${zeroLine}" fill="none" stroke="#4F9FC7" stroke-width="2" stroke-dasharray="5 3"/>` : ''}
    ${parDots}${zeroDots}
    ${xlabels}
  </svg>
  <div style="display:flex;gap:16px;margin-top:8px;font-size:11px;color:var(--muted);">
    <span><span style="display:inline-block;width:10px;height:10px;background:#8F5A39;border-radius:2px;margin-right:5px;"></span>Par curve</span>
    ${showZero ? '<span><span style="display:inline-block;width:10px;height:10px;background:#4F9FC7;border-radius:2px;margin-right:5px;"></span>Bootstrapped zero curve</span>' : ''}
  </div>`;
}

function renderExecutionSection(b){
  const ex = EXECUTION_ESTIMATES[b.id];

  const mid = b.price;
  const dealerRows = DEALER_OFFSETS_BP.map((off,i)=>{
    const bid = mid + (off - ex.bidAskBp/2)/100;

    return `<tr><td class="name-cell">${DEALER_NAMES[i]}</td><td class="num">${bid.toFixed(3)}</td><td class="num">${ask.toFixed(3)}</td><td class="num">${((bid+ask)/2).toFixed(3)}</td></tr>`;
  }).join('');
  return `
    <div style="margin-top:14px;">

        <div class="stat-card"><div class="stat-label">Est. Days to Liquidate</div><div class="stat-value">${ex.daysToLiquidate}</div><div class="stat-sub">typical institutional clip</div></div>
        <div class="stat-card" style="grid-column: span 2;"><div class="stat-label">Liquidity Read</div><div class="stat-value" style="font-size:15px;">${ex.liquidity}</div></div>

      <div class="footnote" style="margin-top:6px;">No free public TCA/RFQ feed exists for this — bid-ask, days-to-liquidate, and the three dealer quotes are illustrative estimates, not a live pull. Fair value (the price shown above) is half the job on a real desk; whether you can actually trade it at that price is the other half, which is what this section stands in for.</div>

}

/* =========================================================================
   RENDER — CREDIT FUNDAMENTALS (real, sourced figures — corporates only)

function renderCreditFundamentalsSection(b){
  const cf = CREDIT_FUNDAMENTALS[b.id];
  if(!cf) return '';
  const statsHtml = cf.stats.map((s,i) => `
    <div class="stat-card ${i===0?'hero':''}"><div class="stat-label">${s.label}</div><div class="stat-value" style="font-size:${s.value.length>8?'16px':'21px'};">${s.value}</div><div class="stat-sub">${s.sub||''}</div></div>
  `).join('');
  return `
    <div style="margin-top:14px;">
      <div class="section-label">Credit Fundamentals</div>

      <div class="footnote" style="margin-top:6px;">Source: ${cf.source}. This is what separates "this spread looks wide" from "this spread is wide for a good reason" — the Z-spread above is a market price, this section is the fundamentals a real credit desk would check before trusting it.</div>
    </div>
  `;
}

/* =========================================================================
   RENDER — CURVE HISTORY (Tier 2 — real 6-month snapshots, same live source)
   ========================================================================= */
function curveEvolutionSvg(){
  const w=440, h=230, padL=34, padR=14, padT=14, padB=26;
  const minY=3.0, maxY=5.2;
  const xForIdx = (i,n) => padL + (i/(n-1))*(w-padL-padR);
  const yFor = (yPct) => padT + (1 - (yPct-minY)/(maxY-minY))*(h-padT-padB);

  const first = CURVE_HISTORY[0], last = CURVE_HISTORY[CURVE_HISTORY.length-1];
  const lineFor = (snap) => snap.yields.map((y,i)=>[xForIdx(i,CURVE_LABELS.length), yFor(y*100)]).map(p=>p.join(',')).join(' ');

  let gridlines = '';
  [3,3.5,4,4.5,5].forEach(v=>{
    const y = yFor(v);
    gridlines += `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="#DCD0BC" stroke-width="1" stroke-dasharray="4 4"/>`;
    gridlines += `<text x="4" y="${y+4}" fill="#6B6156" font-size="10">${v}%</text>`;
  });
  let xlabels = '';
  CURVE_LABELS.forEach((l,i)=>{
    const x = xForIdx(i, CURVE_LABELS.length);
    xlabels += `<text x="${x-10}" y="${h-8}" fill="#6B6156" font-size="10">${l}</text>`;
  });

  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    ${gridlines}
    <polyline points="${lineFor(first)}" fill="none" stroke="#9C9084" stroke-width="2" stroke-dasharray="5 3"/>
    <polyline points="${lineFor(last)}" fill="none" stroke="#8F5A39" stroke-width="2.4"/>
    ${xlabels}
  </svg>
  <div style="display:flex;gap:16px;margin-top:8px;font-size:11px;color:var(--muted);">
    <span><span style="display:inline-block;width:10px;height:2px;background:#9C9084;margin-right:5px;"></span>${first.date}</span>
    <span><span style="display:inline-block;width:10px;height:2px;background:#8F5A39;margin-right:5px;"></span>${last.date}</span>
  </div>`;
}

function spreadTrendSvg(){
  const w=440, h=180, padL=38, padR=14, padT=14, padB=26;
  const spreads = CURVE_HISTORY.map(h => (h.yields[5]-h.yields[3])*10000); // 10Y - 2Y in bp
  const minV = Math.min(...spreads)-10, maxV = Math.max(...spreads)+10;
  const xForIdx = (i,n) => padL + (i/(n-1))*(w-padL-padR);
  const yFor = (v) => padT + (1 - (v-minV)/(maxV-minV))*(h-padT-padB);

  let gridlines = `<line x1="${padL}" y1="${yFor(0)}" x2="${w-padR}" y2="${yFor(0)}" stroke="#A32E22" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="${w-padR-60}" y="${yFor(0)-4}" fill="#A32E22" font-size="9">inversion line</text>`;
  const pts = spreads.map((v,i)=>[xForIdx(i,spreads.length), yFor(v)]);
  const line = pts.map(p=>p.join(',')).join(' ');
  const dots = pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#8F5A39"/><text x="${p[0]-10}" y="${p[1]-8}" font-size="10" fill="#16140F">${spreads[i].toFixed(0)}bp</text>`).join('');
  const xlabels = CURVE_HISTORY.map((hst,i)=>`<text x="${xForIdx(i,CURVE_HISTORY.length)-16}" y="${h-8}" fill="#6B6156" font-size="9">${hst.date.slice(5)}</text>`).join('');

  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    ${gridlines}
    <polyline points="${line}" fill="none" stroke="#4F9FC7" stroke-width="2"/>
    ${dots}${xlabels}
  </svg>`;
}

      </div>
      <div class="footnote" style="margin-top:8px;">Zero rates sit above par yields at the long end — the textbook-correct direction for an upward-sloping curve. 3M/6M treated as direct money-market zeros (single cash flow); 1Y-30Y bootstrapped from par assuming semiannual coupons at $100 face.</div>

    <div>

/* =========================================================================
   RENDER — REAL RATES & INFLATION BREAKEVENS (TIPS)
   ========================================================================= */
function realRatesCurveSvg(){
  const w=440, h=230, padL=34, padR=14, padT=14, padB=26;
  const minY=1.0, maxY=5.5;
  const tenors = [5,10,30];
  const xForIdx = (i,n) => padL + (i/(n-1))*(w-padL-padR);
  const yFor = (v) => padT + (1 - (v-minY)/(maxY-minY))*(h-padT-padB);

  const nomPts = tenors.map((t,i)=>[xForIdx(i,tenors.length), yFor(parCurveFn(t)*100)]);
  const realPts = tenors.map((t,i)=>[xForIdx(i,tenors.length), yFor(realCurveFn(t)*100)]);
  const nomLine = nomPts.map(p=>p.join(',')).join(' ');
  const realLine = realPts.map(p=>p.join(',')).join(' ');

  let gridlines = '';
  [1,2,3,4,5].forEach(v=>{
    const y = yFor(v);
    gridlines += `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="#DCD0BC" stroke-width="1" stroke-dasharray="4 4"/>`;
    gridlines += `<text x="6" y="${y+4}" fill="#6B6156" font-size="10">${v}%</text>`;
  });
  let xlabels = '';
  tenors.forEach((t,i)=>{
    const x = xForIdx(i, tenors.length);
    xlabels += `<text x="${x-10}" y="${h-8}" fill="#6B6156" font-size="10">${t}Y</text>`;
  });

  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    ${gridlines}
    <polyline points="${nomLine}" fill="none" stroke="#8F5A39" stroke-width="2.4"/>
    <polyline points="${realLine}" fill="none" stroke="#4F9FC7" stroke-width="2.4"/>
    ${nomPts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.2" fill="#8F5A39"/>`).join('')}
    ${realPts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.2" fill="#4F9FC7"/>`).join('')}
    ${xlabels}
  </svg>
  <div style="display:flex;gap:16px;margin-top:8px;font-size:11px;color:var(--muted);">
    <span><span style="display:inline-block;width:10px;height:10px;background:#8F5A39;border-radius:2px;margin-right:5px;"></span>Nominal par curve</span>
    <span><span style="display:inline-block;width:10px;height:10px;background:#4F9FC7;border-radius:2px;margin-right:5px;"></span>Real (TIPS) curve</span>
  </div>`;
}

function renderRealRatesSection(){
  const rows = REAL_CURVE_POINTS.map(p=>{
    const nominal = parCurveFn(p.years);
    const breakeven = nominal - p.yield;
    return `<tr><td class="name-cell">${p.label}</td><td class="num">${pct(nominal,2)}</td><td class="num">${pct(p.yield,2)}</td><td class="num" style="font-weight:600;">${pct(breakeven,2)}</td><td class="footnote" style="border:none;padding-left:16px;">${p.asOf}</td></tr>`;
  }).join('');
  const curveImplied10Y = parCurveFn(10) - realCurveFn(10);

  const tipsCards = TIPS_BONDS.map(t=>`
    <div class="stat-card">
      <div class="stat-label">${t.id}</div>
      <div class="stat-value" style="font-size:16px;">${t.realPrice.toFixed(3)} <span class="footnote" style="font-style:normal;">real price</span></div>
      <div class="stat-sub">Real YTM ${pct(t.realYtm,3)} · Real Mod. Dur. ${t.realModD.toFixed(2)}y · Real DV01 ${t.realDV01.toFixed(4)}</div>
      <div class="stat-sub">Index ratio ${t.indexRatio.toFixed(2)}x (illustrative) → adj. principal ${t.adjustedPrincipal.toFixed(2)} → nominal settlement ${t.nominalSettlement.toFixed(2)}</div>
    </div>
  `).join('');

  return `
    <div>
      <div class="section-label">Real Rates &amp; Inflation Breakevens (TIPS)</div>
      <div class="split">
        <div class="stat-card">${realRatesCurveSvg()}</div>
        <div style="display:flex;flex-direction:column;gap:12px;">
          <div class="stat-card hero"><div class="stat-label">10Y Breakeven (curve-implied)</div><div class="stat-value">${pct(curveImplied10Y,2)}</div><div class="stat-sub">nominal − real, both from this platform's curves</div></div>
          <div class="stat-card"><div class="stat-label">10Y Breakeven (directly quoted)</div><div class="stat-value">${pct(QUOTED_10Y_BREAKEVEN.value,2)}</div><div class="stat-sub">${QUOTED_10Y_BREAKEVEN.source}, ${QUOTED_10Y_BREAKEVEN.asOf}</div></div>
        </div>
      </div>
      <div class="table-card" style="margin-top:10px;">
        <table>
          <thead><tr><th>Tenor</th><th class="num">Nominal</th><th class="num">Real (TIPS)</th><th class="num">Breakeven</th><th>As Of</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div class="callout" style="margin-top:10px;"><b>Why the two 10Y breakevens don't match exactly:</b> the curve-implied number blends a June 2026 nominal curve with an April 2026 real curve — different vintages, because TIPS real yields moved through the year and the freshest read per tenor came from different dates. The directly-quoted FRED number uses same-day nominal and real prints. The gap between them (${bp(Math.abs(curveImplied10Y-QUOTED_10Y_BREAKEVEN.value),0)}) is a vintage-mismatch artifact, not a real market signal — worth knowing before trusting a derived number blindly.</div>
      <div class="grid4" style="margin-top:10px;">${tipsCards}</div>
      <div class="footnote" style="margin-top:6px;">TIPS priced on a real basis (real coupon, discounted at the real yield) — the standard TIPS quoting convention. Index ratio (cumulative CPI accretion since issuance) is illustrative; the real yield curve feeding the price is real, sourced Treasury.gov/FRED data. Real duration/DV01 here are genuinely real, not a nominal-equivalent conversion — deliberately not mixed into the Portfolio &amp; Risk tab's weighted duration, since blending real and nominal duration into one number would be silently wrong, not just a simplification.</div>
    </div>
  `;
}

/* =========================================================================
   RENDER — INTERNATIONAL CURVE COMPARISON
   ========================================================================= */
function intlCurveSvg(){
  const w=440, h=230, padL=34, padR=14, padT=14, padB=26;
  const minY=0.5, maxY=6.0;
  const tenors = [2,10,30];
  const xForIdx = (i,n) => padL + (i/(n-1))*(w-padL-padR);
  const yFor = (v) => padT + (1 - (v-minY)/(maxY-minY))*(h-padT-padB);
  const colors = { US:'#8F5A39', JGB:'#A32E22', BUND:'#4F9FC7', GILT:'#15803D' };

  let gridlines = '';
  [1,2,3,4,5,6].forEach(v=>{
    const y = yFor(v);
    gridlines += `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="#DCD0BC" stroke-width="1" stroke-dasharray="4 4"/>`;
    gridlines += `<text x="6" y="${y+4}" fill="#6B6156" font-size="10">${v}%</text>`;
  });
  let xlabels = '';
  tenors.forEach((t,i)=>{
    xlabels += `<text x="${xForIdx(i,tenors.length)-10}" y="${h-8}" fill="#6B6156" font-size="10">${t}Y</text>`;
  });

  const usPts = tenors.map((t,i)=>[xForIdx(i,tenors.length), yFor(parCurveFn(t)*100)]);
  let lines = `<polyline points="${usPts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${colors.US}" stroke-width="2.4"/>`;
  lines += usPts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${colors.US}"/>`).join('');
  ['JGB','BUND','GILT'].forEach(key=>{
    const pts = tenors.map((t,i)=>[xForIdx(i,tenors.length), yFor(intlYieldAt(key,t)*100)]);
    lines += `<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${colors[key]}" stroke-width="2" stroke-dasharray="5 3"/>`;
    lines += pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${colors[key]}"/>`).join('');
  });

  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    ${gridlines}${lines}${xlabels}
  </svg>
  <div style="display:flex;gap:14px;margin-top:8px;font-size:11px;color:var(--muted);flex-wrap:wrap;">
    <span><span style="display:inline-block;width:10px;height:10px;background:${colors.US};border-radius:2px;margin-right:5px;"></span>US Treasury</span>
    <span><span style="display:inline-block;width:10px;height:2px;background:${colors.JGB};margin-right:5px;"></span>Japan (JGB)</span>
    <span><span style="display:inline-block;width:10px;height:2px;background:${colors.BUND};margin-right:5px;"></span>Germany (Bund)</span>
    <span><span style="display:inline-block;width:10px;height:2px;background:${colors.GILT};margin-right:5px;"></span>UK (Gilt)</span>
  </div>`;
}

/* =========================================================================
   RENDER — PORTFOLIO & RISK
   ========================================================================= */
function computePortfolio(){
  let totalWeight = 0, wYTM = 0, wDur = 0, wConv = 0, wDV01 = 0, wSpread = 0;
  ALL_INSTRUMENTS.forEach(b=>{
    const w = portfolioWeights[b.id] || 0;
    totalWeight += w;
    const y = b.ytm !== undefined ? b.ytm : b.bey;
    wYTM += w * y;
    wDur += w * b.modD;
    wConv += w * (b.conv || 0);
    wDV01 += w * b.dv01;
    wSpread += w * (b.nominalSpread || 0);
  });
  const Z95 = 1.645;
  const VaR = Z95 * wDur * DAILY_YIELD_VOL * portfolioValue;
  return { totalWeight, wYTM, wDur, wConv, wDV01, wSpread, VaR };
}

/* =========================================================================
   BENCHMARK — illustrative Bloomberg US Aggregate-style proxy, anchored to real, sourced index
   characteristics (iShares AGG, which tracks the Bloomberg US Agg). Active metrics and tracking error
   below are computed against this.
   ========================================================================= */
const BENCHMARK = {
  name: 'Broad Market Aggregate (Bloomberg US Agg-style proxy)',
  duration: 5.77, ytm: 0.0497, oas: 0.00265,
  asOf: '2026-07-31', source: 'iShares Core U.S. Aggregate Bond ETF (AGG) fact sheet',
};
function benchmarkComparison(p){
  const activeDuration = p.wDur - BENCHMARK.duration;
  const activeYield = p.wYTM - BENCHMARK.ytm;
  const activeSpread = p.wSpread - BENCHMARK.oas;
  // Duration-based tracking error: same first-order approximation style as the platform's existing
  // parametric VaR, applied to ACTIVE duration instead of total duration — annualized via sqrt(252).
  const trackingError = Math.abs(activeDuration) * DAILY_YIELD_VOL * Math.sqrt(252);
  return { activeDuration, activeYield, activeSpread, trackingError };
}

/* =========================================================================
   RENDER — MONTE CARLO / FAT-TAILED VaR
   ========================================================================= */
let mcSeed = 42;
function mcHistogramSvg(pnls, portfolioVal){
  const w=440, h=180, padL=14, padR=14, padT=10, padB=26;
  const nBins = 24;
  const min = pnls[0], max = pnls[pnls.length-1];
  const range = (max-min) || 1;
  const bins = new Array(nBins).fill(0);
  pnls.forEach(v=>{
    let idx = Math.floor(((v-min)/range)*nBins);
    if(idx>=nBins) idx = nBins-1; if(idx<0) idx=0;
    bins[idx]++;
  });
  const maxCount = Math.max(...bins,1);
  const binW = (w-padL-padR)/nBins;
  const var95Idx = Math.floor(nBins*0.05);
  let bars = '';
  bins.forEach((c,i)=>{
    const barH = (c/maxCount)*(h-padT-padB);
    const x = padL + i*binW;
    const y = h-padB-barH;
    const color = i <= var95Idx ? '#A32E22' : '#8F5A39';
    bars += `<rect x="${x}" y="${y}" width="${Math.max(1,binW-1)}" height="${barH}" fill="${color}" opacity="0.85"/>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    ${bars}
    <line x1="${padL}" y1="${h-padB}" x2="${w-padR}" y2="${h-padB}" stroke="#DCD0BC" stroke-width="1"/>
    <text x="${padL}" y="${h-8}" fill="#6B6156" font-size="10">${money(min)}</text>
    <text x="${w-padR-50}" y="${h-8}" fill="#6B6156" font-size="10">${money(max)}</text>
  </svg>
  <div style="display:flex;gap:16px;margin-top:6px;font-size:11px;color:var(--muted);">
    <span><span style="display:inline-block;width:10px;height:10px;background:#A32E22;border-radius:2px;margin-right:5px;"></span>Worst 5% of simulated outcomes</span>
    <span><span style="display:inline-block;width:10px;height:10px;background:#8F5A39;border-radius:2px;margin-right:5px;"></span>Rest of the distribution</span>
  </div>`;
}
function renderMonteCarloSection(exposures, p){
  const holdings = ALL_INSTRUMENTS.filter(b => portfolioWeights[b.id] !== undefined);
  if(holdings.length === 0){
    return `<div><div class="section-label">Monte Carlo / Fat-Tailed VaR</div><div class="footnote">Add positions from the Dashboard watchlist to run the simulation.</div></div>`;
  }
  const nPaths = 5000;
  const normalResult = runMonteCarloVar(exposures, nPaths, mcSeed, false);
  const fatResult = runMonteCarloVar(exposures, nPaths, mcSeed, true);
  const parametricVaR = p.VaR;

  return `
    <div>
      <div class="section-label">Monte Carlo / Fat-Tailed VaR — ${nPaths.toLocaleString()} Simulated Paths</div>
      <div class="grid4">
        <div class="stat-card"><div class="stat-label">Parametric VaR (95%)</div><div class="stat-value">${money(parametricVaR)}</div><div class="stat-sub">existing closed-form estimate, above</div></div>
        <div class="stat-card"><div class="stat-label">Monte Carlo VaR (95%, normal)</div><div class="stat-value">${money(normalResult.var95)}</div><div class="stat-sub">simulated, factor-correlated</div></div>
        <div class="stat-card hero"><div class="stat-label">Monte Carlo VaR (95%, fat-tailed)</div><div class="stat-value" style="color:var(--red)">${money(fatResult.var95)}</div><div class="stat-sub">~5% chance of a 3-5x amplified shock</div></div>
        <div class="stat-card"><div class="stat-label">CVaR / Expected Shortfall (95%, fat-tailed)</div><div class="stat-value" style="color:var(--red)">${money(fatResult.cvar95)}</div><div class="stat-sub">avg. loss in the worst 5% of paths</div></div>
      </div>
      <div class="split" style="margin-top:10px;">
        <div class="stat-card">${mcHistogramSvg(normalResult.pnls, portfolioValue)}<div class="footnote" style="margin-top:4px;">Normal-shock simulation</div></div>
        <div class="stat-card">${mcHistogramSvg(fatResult.pnls, portfolioValue)}<div class="footnote" style="margin-top:4px;">Fat-tailed simulation</div></div>
      </div>
      <div class="field-row" style="margin-top:10px;">
        <button class="ghost-btn" onclick="mcSeed = Date.now() % 100000; renderPortfolioPage();">Re-run Simulation (new random seed)</button>
      </div>
      <div class="footnote" style="margin-top:6px;">Seeded so results are reproducible on reload — click above for a fresh draw. Both simulations draw from the same factor covariance matrix as the section above (Cholesky decomposition of the correlation matrix, correlated normal shocks); the fat-tailed version mixes in an occasional amplified shock, a simple scale-mixture approach rather than a full Student-t sampler. The gap between the 95% and fat-tailed numbers is the concrete answer to "how much does the fat-tails assumption actually matter" — not just a caveat in a footnote anymore.</div>
    </div>
  `;
}

/* =========================================================================
   RENDER — KEY RATE DURATION (Portfolio & Risk tab)
   ========================================================================= */
function krdBarChart(portfolioKrd, maxAbs){
  const w=440, h=200, padL=34, padR=14, padT=14, padB=30;
  const n = KEY_RATE_NODES.length;
  const barW = (w-padL-padR)/n * 0.6;
  const xForIdx = (i) => padL + (i+0.5)*((w-padL-padR)/n);
  const zeroY = padT + (h-padT-padB)/2;
  const scale = (h-padT-padB)/2 / (maxAbs || 1);

  let bars = '', labels = '';
  portfolioKrd.forEach((v,i)=>{
    const x = xForIdx(i);
    const barH = Math.abs(v)*scale;
    const y = v >= 0 ? zeroY - barH : zeroY;
    bars += `<rect x="${x-barW/2}" y="${y}" width="${barW}" height="${Math.max(1,barH)}" fill="${v>=0?'#8F5A39':'#A32E22'}" rx="2"/>`;
    labels += `<text x="${x}" y="${h-10}" fill="#6B6156" font-size="10" text-anchor="middle">${CURVE_LABELS[i]}</text>`;
    labels += `<text x="${x}" y="${v>=0 ? y-4 : y+barH+12}" fill="#16140F" font-size="10" text-anchor="middle">${v.toFixed(2)}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <line x1="${padL}" y1="${zeroY}" x2="${w-padR}" y2="${zeroY}" stroke="#DCD0BC" stroke-width="1"/>
    ${bars}${labels}
  </svg>`;
}

function renderKeyRateDurationSection(holdingsKRD){
  const holdings = ALL_INSTRUMENTS.filter(b => portfolioWeights[b.id] !== undefined);
  if(holdings.length === 0){
    return `<div><div class="section-label">Key Rate Duration</div><div class="footnote">Add positions from the Dashboard watchlist to see where the portfolio's rate risk sits on the curve.</div></div>`;
  }
  const portfolioKrd = new Array(KEY_RATE_NODES.length).fill(0);
  let perBondRows = '';
  holdings.forEach(b=>{
    const w = portfolioWeights[b.id];
    const krd = holdingsKRD[b.id];
    krd.forEach((v,i)=> portfolioKrd[i] += w*v);
    perBondRows += `<tr><td class="name-cell">${b.id}</td>${krd.map(v=>`<td class="num">${v.toFixed(2)}</td>`).join('')}<td class="num" style="font-weight:600;">${b.modD.toFixed(2)}</td></tr>`;
  });
  const absKrd = portfolioKrd.map(Math.abs);
  const maxAbs = Math.max(...absKrd, 0.01);
  const maxIdx = absKrd.indexOf(maxAbs);
  const sumCheck = portfolioKrd.reduce((a,b)=>a+b,0);

  return `
    <div>
      <div class="section-label">Key Rate Duration — Where Portfolio Rate Risk Actually Sits</div>
      <div class="split">
        <div class="stat-card">${krdBarChart(portfolioKrd, maxAbs)}</div>
        <div style="display:flex;flex-direction:column;gap:12px;">
          <div class="stat-card hero"><div class="stat-label">Sum of Key Rate Durations</div><div class="stat-value">${sumCheck.toFixed(2)}</div><div class="stat-sub">reconciles to Effective Duration above</div></div>
          <div class="stat-card"><div class="stat-label">Largest Single Exposure</div><div class="stat-value">${CURVE_LABELS[maxIdx]}</div><div class="stat-sub">where a curve twist would hurt (or help) most</div></div>
        </div>
      </div>
      <div class="table-card" style="margin-top:10px;">
        <table>
          <thead><tr><th>Instrument</th>${CURVE_LABELS.map(l=>`<th class="num">${l}</th>`).join('')}<th class="num">Total</th></tr></thead>
          <tbody>${perBondRows}</tbody>
        </table>
      </div>
      <div class="footnote" style="margin-top:6px;">Per-node modified-duration contribution (years), via cashflow mapping — not a full curve Jacobian, but standard practitioner shorthand. This catches "shaping risk" a single duration number misses entirely: a portfolio can be duration-neutral overall while carrying a large, offsetting bet on the belly vs. the wings of the curve.</div>
    </div>
  `;
}

function updateWeight(id, val){
  portfolioWeights[id] = Math.max(0, parseFloat(val)||0) / 100;
  renderPortfolioPage();
}
function updatePortfolioValue(val){
  portfolioValue = Math.max(0, parseFloat(val)||0);
  renderPortfolioPage();
}

const SCENARIOS = {
  bear: { label:'Bear', delta: 0.0056, spreadDelta: 0.0015, note:'deficits widen, term premium re-rates higher, Fed holds; risk appetite softens, corporate spreads widen ~15bp' },
  base: { label:'Base', delta: 0.0000, spreadDelta: 0.0000, note:'today\'s anchors roughly hold' },
  bull: { label:'Bull', delta: -0.0064, spreadDelta: -0.0010, note:'deficit consolidation, Fed cuts, term premium compresses; risk appetite firms, corporate spreads tighten ~10bp' },
};

function scenarioImpact(deltaY){
  let impact = 0;
  ALL_INSTRUMENTS.forEach(b=>{
    const w = portfolioWeights[b.id] || 0;
    impact += w * priceImpactFromYieldShock(b.modD, b.conv || 0, deltaY);
  });
  return impact;
}

    </div>

    ${explainerBox(`Bull/base/bear aren't predictions — they're the yield decomposition (expected short rate + term premium) stress-tested under different assumptions about the deficit trajectory and Fed policy. A <b>parallel shock</b> moves every maturity the same amount; a real curve move is rarely that clean, which is what the Historical Scenario Replay below is for. Watch convexity on the long end: it's why a -50bp shock doesn't just mirror the loss from a +50bp one — the gain is bigger, which is the positive-convexity effect explained on the Bond Valuation tab. <b>Return attribution</b> splits that same price move into what you earned for waiting (carry), what the rate move cost or made you (curve), and what a credit re-rating cost or made you (spread) — three different reasons to own or avoid a bond, collapsed into one number if you only look at total return.`)}

function applyScenario(key){
  const s = SCENARIOS[key];

function applyCustomShock(){
  const bpVal = parseFloat(document.getElementById('shockInput').value) || 0;
  const spreadBpVal = parseFloat(document.getElementById('spreadShockInput').value) || 0;
  renderScenarioDetail(bpVal/10000, spreadBpVal/10000, `Custom shock: ${bpVal>=0?'+':''}${bpVal}bp curve, ${spreadBpVal>=0?'+':''}${spreadBpVal}bp corporate spread`);
}
function renderScenarioDetail(deltaY, spreadDeltaY, label){
  let rows = '';
  let attrRows = '';
  ALL_INSTRUMENTS.forEach(b=>{
    const w = portfolioWeights[b.id];
    if(w === undefined) return;
    const effectiveSpreadShock = b.type === 'Corporate' ? spreadDeltaY : 0;
    const impactPct = priceImpactFromYieldShock(b.modD, b.conv || 0, deltaY) + priceImpactFromYieldShock(b.modD, 0, effectiveSpreadShock);
    const newPrice = b.price * (1 + impactPct);
    rows += `<tr>
      <td class="name-cell">${b.id}</td>
      <td class="num">${b.price.toFixed(2)}</td>
      <td class="num">${newPrice.toFixed(2)}</td>
      <td class="num ${impactPct>=0?'up':'down'}">${(impactPct*100).toFixed(2)}%</td>
    </tr>`;

    if(b.type !== 'Bill'){
      const attr = returnAttribution(b, 0.25, deltaY, effectiveSpreadShock);
      attrRows += `<tr>
        <td class="name-cell">${b.id}</td>
        <td class="num">${(attr.carry*100).toFixed(2)}%</td>
        <td class="num ${attr.curveEffect>=0?'up':'down'}">${(attr.curveEffect*100).toFixed(2)}%</td>
        <td class="num ${attr.spreadEffect>=0?'up':'down'}">${(attr.spreadEffect*100).toFixed(2)}%</td>
        <td class="num ${attr.total>=0?'up':'down'}">${(attr.total*100).toFixed(2)}%</td>
      </tr>`;
    }
  });
  if(rows==='') rows = `<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:20px;">No positions in portfolio.</td></tr>`;
  if(attrRows==='') attrRows = `<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:20px;">No positions in portfolio.</td></tr>`;
  const totalImpact = scenarioImpact(deltaY) + ALL_INSTRUMENTS.reduce((sum,b)=>{
    const w = portfolioWeights[b.id] || 0;
    const eff = b.type==='Corporate' ? spreadDeltaY : 0;
    return sum + w * priceImpactFromYieldShock(b.modD, 0, eff);
  }, 0);
  document.getElementById('scenarioDetail').innerHTML = `
    <div class="section-label">${label}</div>
    <div class="grid4" style="margin-bottom:14px;">
      <div class="stat-card hero"><div class="stat-label">Portfolio Price Impact</div><div class="stat-value ${totalImpact>=0?'up':'down'}">${(totalImpact*100).toFixed(2)}%</div><div class="stat-sub">${money(totalImpact*portfolioValue)}</div></div>
    </div>
    <div class="table-card">
      <table>
        <thead><tr><th>Instrument</th><th class="num">Price Before</th><th class="num">Price After</th><th class="num">% Impact</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>

    <div class="section-label" style="margin-top:18px;">Return Attribution — 3-Month Horizon</div>
    <div class="table-card">
      <table>
        <thead><tr><th>Instrument</th><th class="num">Carry + Roll</th><th class="num">Curve Effect</th><th class="num">Spread Effect</th><th class="num">Total</th></tr></thead>
        <tbody>${attrRows}</tbody>
      </table>
    </div>
    <div class="footnote" style="margin-top:6px;">Carry + Roll assumes the curve stays static (from the Bond Valuation tab's methodology). Curve Effect and Spread Effect are the incremental price impact from this specific scenario's rate shock and corporate-spread shock, via duration + convexity. The three should roughly explain the total — that reconciliation is the point of attribution, not just the total return number.</div>
  `;
}

/** Bond dots plotted against the par curve at their actual maturity (interpolated x position). */
function comparisonCurveSvg(selectedIds){
  const w=440, h=230, padL=34, padR=14, padT=14, padB=26;
  const minY=3.0, maxY=9.5; // wide enough to fit the full universe, from govies to a single-B credit
  const anchors = CURVE_TENOR_ARR;
  const xForIdx = (i,n) => padL + (i/(n-1))*(w-padL-padR);
  const yFor = (yPct) => padT + (1 - (yPct-minY)/(maxY-minY))*(h-padT-padB);
  function xForYears(years){
    const n = anchors.length;
    if(years <= anchors[0]) return padL;
    if(years >= anchors[n-1]) return w-padR;
    for(let i=0;i<n-1;i++){
      if(years >= anchors[i] && years <= anchors[i+1]){
        const x0 = xForIdx(i,n), x1 = xForIdx(i+1,n);
        const frac = (years-anchors[i])/(anchors[i+1]-anchors[i]);
        return x0 + frac*(x1-x0);
      }
    }
    return w-padR;
  }

  const parPts = CURVE_YIELDS.map((y,i)=>[xForIdx(i,CURVE_YIELDS.length), yFor(y*100)]);
  const parLine = parPts.map(p=>p.join(',')).join(' ');

  let gridlines = '';
  [3,4,5,6,7,8,9].forEach(v=>{
    const y = yFor(v);
    gridlines += `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="#DCD0BC" stroke-width="1" stroke-dasharray="4 4"/>`;
    gridlines += `<text x="6" y="${y+4}" fill="#6B6156" font-size="10">${v}%</text>`;
  });
  let xlabels = '';
  CURVE_LABELS.forEach((l,i)=>{
    const x = xForIdx(i, CURVE_LABELS.length);
    xlabels += `<text x="${x-10}" y="${h-8}" fill="#6B6156" font-size="10">${l}</text>`;
  });

  let bondDots = '', bondLabels = '';
  selectedIds.forEach(id=>{
    const b = ALL_INSTRUMENTS.find(x=>x.id===id);
    const years = b.years !== undefined ? b.years : b.daysToMaturity/365;
    const yieldVal = (b.ytm !== undefined ? b.ytm : b.bey) * 100;
    const x = xForYears(years), y = yFor(yieldVal);
    const dotColor = b.type === 'Corporate' ? '#4F9FC7' : '#8F5A39';
    bondDots += `<circle cx="${x}" cy="${y}" r="5" fill="${dotColor}" stroke="#fff" stroke-width="1.5"/>`;
    bondLabels += `<text x="${x+7}" y="${y+4}" fill="#16140F" font-size="10" font-weight="600">${id}</text>`;
  });

  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    ${gridlines}
    <polyline points="${parLine}" fill="none" stroke="#8F5A39" stroke-width="2" stroke-dasharray="3 3" opacity="0.6"/>
    ${bondDots}${bondLabels}
    ${xlabels}
  </svg>
  <div style="display:flex;gap:16px;margin-top:8px;font-size:11px;color:var(--muted);flex-wrap:wrap;">
    <span><span style="display:inline-block;width:10px;height:2px;background:#8F5A39;margin-right:5px;"></span>Par curve</span>
    <span><span style="display:inline-block;width:10px;height:10px;background:#4F9FC7;border-radius:50%;margin-right:5px;"></span>Corporate</span>
    <span><span style="display:inline-block;width:10px;height:10px;background:#8F5A39;border-radius:50%;margin-right:5px;"></span>Sovereign / Bill</span>
  </div>`;
}

/** Horizontal Z-spread bar chart for the selected coupon-bearing instruments. */
function spreadBarChart(selectedIds){
  const items = selectedIds.map(id=>ALL_INSTRUMENTS.find(x=>x.id===id)).filter(b=>b.type!=='Bill');
  if(items.length===0) return '<div class="footnote">No coupon bonds selected.</div>';
  const spreadsBp = items.map(b=>b.z*10000);
  const maxAbs = Math.max(50, ...spreadsBp.map(Math.abs));
  const barMax = Math.ceil(maxAbs/50)*50;
  const rowH = 34, chartW = 400, labelW = 66, barAreaW = chartW-labelW-56;
  let bars = '';
  items.forEach((b,i)=>{
    const spBp = b.z*10000;
    const y = i*rowH;
    const wpx = Math.max(2, (Math.abs(spBp)/barMax)*barAreaW);
    const color = b.type==='Sovereign' ? '#8F5A39' : (spBp > 150 ? '#A32E22' : '#4F9FC7');
    bars += `<text x="0" y="${y+16}" font-size="11" fill="#16140F" font-family="JetBrains Mono, monospace">${b.id}</text>
      <rect x="${labelW}" y="${y+4}" width="${wpx}" height="18" rx="3" fill="${color}"/>
      <text x="${labelW+wpx+8}" y="${y+16}" font-size="11" fill="#16140F" font-family="JetBrains Mono, monospace">${spBp.toFixed(0)}bp</text>`;
  });
  const totalH = items.length*rowH + 10;
  return `<svg viewBox="0 0 ${chartW} ${totalH}" xmlns="http://www.w3.org/2000/svg">${bars}</svg>`;
}

/** Illustrative typical IG/HY spread-by-rating curve (5Y benchmark, bp) — no free live source for
    this exists, so these are representative market levels, not a data pull. Overlaid with our 3
    actual computed Z-spreads to show where a specific credit sits vs. the generic curve for its
    rating bucket. */
const TYPICAL_SPREAD_BY_RATING = [
  { bucket:'AAA', bp:20 }, { bucket:'AA', bp:35 }, { bucket:'A', bp:70 },
  { bucket:'BBB', bp:115 }, { bucket:'BB', bp:220 }, { bucket:'B', bp:380 },
];
function ratingBucket(rating){
  if(rating.startsWith('AAA')) return 'AAA';
  if(rating.startsWith('AA')) return 'AA';
  if(rating.startsWith('A')) return 'A';
  if(rating.startsWith('BBB')) return 'BBB';
  if(rating.startsWith('BB')) return 'BB';
  return 'B';
}
function creditSpreadCurveSvg(){
  const w=440, h=230, padL=40, padR=14, padT=14, padB=30;
  const maxBp = 500;
  const n = TYPICAL_SPREAD_BY_RATING.length;
  const xForIdx = (i) => padL + (i/(n-1))*(w-padL-padR);
  const yFor = (v) => padT + (1 - v/maxBp)*(h-padT-padB);

  let gridlines = '';
  [0,100,200,300,400,500].forEach(v=>{
    const y = yFor(v);
    gridlines += `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="#DCD0BC" stroke-width="1" stroke-dasharray="4 4"/>`;
    gridlines += `<text x="2" y="${y+4}" fill="#6B6156" font-size="10">${v}</text>`;
  });
  const pts = TYPICAL_SPREAD_BY_RATING.map((r,i)=>[xForIdx(i), yFor(r.bp)]);
  const line = pts.map(p=>p.join(',')).join(' ');
  const dots = pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#8F5A39"/>`).join('');
  const xlabels = TYPICAL_SPREAD_BY_RATING.map((r,i)=>`<text x="${xForIdx(i)-8}" y="${h-10}" fill="#6B6156" font-size="10">${r.bucket}</text>`).join('');

  // overlay our 3 real corporates at their rating bucket's x position
  const corporates = BONDS.filter(b=>b.type==='Corporate');
  const bucketCounts = {};
  const markers = corporates.map(b=>{
    const bucket = ratingBucket(b.rating);
    const idx = TYPICAL_SPREAD_BY_RATING.findIndex(r=>r.bucket===bucket);
    const seenInBucket = bucketCounts[bucket] || 0;
    bucketCounts[bucket] = seenInBucket + 1;
    const jitter = seenInBucket * 11; // stagger same-bucket markers so labels don't overlap
    const x = xForIdx(idx < 0 ? 2 : idx) + jitter;
    const y = yFor(b.z*10000);
    return `<rect x="${x-4}" y="${y-4}" width="8" height="8" fill="#4F9FC7" stroke="#fff" stroke-width="1" transform="rotate(45 ${x} ${y})"/>
      <text x="${x+8}" y="${y+4}" font-size="9.5" font-weight="600" fill="#16140F">${b.id}</text>`;
  }).join('');

  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    ${gridlines}
    <polyline points="${line}" fill="none" stroke="#8F5A39" stroke-width="2" stroke-dasharray="3 3" opacity="0.7"/>
    ${dots}${markers}${xlabels}
  </svg>
  <div style="display:flex;gap:16px;margin-top:8px;font-size:11px;color:var(--muted);flex-wrap:wrap;">
    <span><span style="display:inline-block;width:10px;height:2px;background:#8F5A39;margin-right:5px;"></span>Illustrative typical curve (5Y, bp)</span>
    <span><span style="display:inline-block;width:8px;height:8px;background:#4F9FC7;margin-right:5px;transform:rotate(45deg);"></span>Our bonds (actual Z-spread)</span>
  </div>`;
}

        ${spreadBarChart(selectedIds)}
      </div>
    </div>

    <div>
      <div class="section-label">Side-by-Side Fundamentals</div>
      <div class="table-card">
        <table>
          <thead><tr><th>Instrument</th><th>Rating</th><th class="num">Maturity</th><th class="num">Price</th><th class="num">YTM</th><th class="num">Mod. Duration</th><th class="num">Convexity</th><th class="num">Nom. Spread</th><th class="num">Z-Spread</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>

    <div class="callout"><b>Reading this view:</b> a dot sitting above the dashed par curve is trading cheap relative to government paper at that maturity — higher yield than the curve implies for that tenor. A dot below the line is rich. Z-spread makes the same read precise: it's "cheap vs. rich," but measured against the whole curve rather than eyeballing one point on it.</div>

    <div>
      <div class="section-label">Relative Value Ranking — All Bonds, Cheapest First</div>
      <div class="table-card">
        <table>
          <thead><tr><th>Rank</th><th>Instrument</th><th>Rating</th><th class="num">Z-Spread</th><th class="num">Typical for Rating</th><th class="num">Residual</th></tr></thead>
          <tbody>
            ${BONDS.slice().sort((a,b2)=>b2.z-a.z).map((b,i)=>{
              const bucket = ratingBucket(b.rating);
              const typical = TYPICAL_SPREAD_BY_RATING.find(r=>r.bucket===bucket).bp;
              const residual = b.z*10000 - typical;
              return `<tr><td class="num">${i+1}</td><td class="name-cell">${b.id}</td><td><span class="rating-pill">${b.rating}</span></td><td class="num">${bp(b.z,0)}</td><td class="num">${typical}bp</td><td class="num ${residual>=0?'up':'down'}">${residual>=0?'+':''}${residual.toFixed(0)}bp</td></tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
      <div class="footnote" style="margin-top:6px;">Ranked by raw Z-spread, widest first. Residual = actual Z-spread minus the illustrative typical spread for that rating bucket — positive means cheap for its rating, not just cheap in absolute terms. With only 6 bonds this is a toy version of a real screen; the same logic run over hundreds of names is what a systematic RV desk actually does.</div>
    </div>

    <div>
      <div class="section-label">Credit Spread Curve by Rating</div>
      <div class="stat-card">${creditSpreadCurveSvg()}</div>
      <div class="callout" style="margin-top:14px;"><b>No free live source for this one:</b> the dashed line is a representative, illustrative spread-by-rating curve, not a data pull — there's no free public feed for corporate credit curves the way there is for Treasuries. What's real: the diamond markers, which are our 3 bonds' actual computed Z-spreads. Apple sits almost exactly on the generic AA curve; JPMorgan and Tesla both trade above their generic bucket, which is either idiosyncratic risk premium or this specific mock pricing — worth knowing which, before trusting the read.</div>
    </div>

    ${explainerBox(`A bond trading above the dashed par curve is cheap for its maturity — higher yield than the government curve implies. Below the line, it's rich. Z-spread is the same read made precise, using the whole curve instead of eyeballing one point. The credit spread curve above adds a second axis: is this bond cheap/rich vs. the government curve, or cheap/rich vs. its own rating peers — those are different questions, and a bond can answer them differently, which is exactly what's worth checking before assuming "wide spread" automatically means "bad credit."`)}
  `;
}

/* =========================================================================
   RENDER — DERIVATIVES (Treasury futures, swaps, DV01 hedge calculator)
   ========================================================================= */
function renderDerivativesPage(){
  const futuresRows = FUTURES_SPEC.map(spec=>{
    const f = futuresContractDV01(spec);
    return `<tr>
      <td class="name-cell">${spec.id}<br><span style="font-size:11px;color:var(--muted);">${spec.label}</span></td>
      <td class="num">${pct(f.parYield,2)}</td>
      <td class="num">${f.ctdModD.toFixed(2)}</td>
      <td class="num">$${f.futuresDV01PerContract.toFixed(0)}</td>
      <td class="num">${spec.convFactor.toFixed(2)}</td>
    </tr>`;
  }).join('');

  const swapRows = SWAP_TENORS.map(t=>{
    const fixed = swapParRate(t);
    const treasuryY = parCurveFn(t);
    const dv01_1mm = swapDV01Per1mm(t);
    return `<tr>
      <td class="name-cell">${t}Y</td>
      <td class="num">${pct(fixed,3)}</td>
      <td class="num">${pct(treasuryY,3)}</td>
      <td class="num ${SWAP_SPREAD_BP[t]>=0?'up':'down'}">${SWAP_SPREAD_BP[t]}bp</td>
      <td class="num">$${dv01_1mm.toFixed(0)}</td>
    </tr>`;
  }).join('');

  const p = computePortfolio();
  const dollarDV01 = portfolioValue * p.wDV01 / 100;

  document.getElementById('page-derivatives').innerHTML = `
    <div>
      <div class="section-label">Treasury Futures (Illustrative CTD/Conversion Factors)</div>
      <div class="table-card">
        <table>
          <thead><tr><th>Contract</th><th class="num">CTD Proxy Yield</th><th class="num">CTD Mod. Duration</th><th class="num">Futures DV01/Contract</th><th class="num">Conv. Factor</th></tr></thead>
          <tbody>${futuresRows}</tbody>
        </table>
      </div>
      <div class="footnote" style="margin-top:6px;">No live deliverable-basket feed exists for this — the CTD is an illustrative on-the-run-style proxy (par-priced note at today's curve yield for that tenor), not a live CTD screen. Futures DV01 ≈ CTD DV01 / conversion factor, per $100,000 contract — the standard approximation, not the full delivery-option-adjusted number a real desk would run.</div>
    </div>

    <div>
      <div class="section-label">Par Swap Rates</div>
      <div class="table-card">
        <table>
          <thead><tr><th>Tenor</th><th class="num">Par Swap Rate</th><th class="num">Treasury Yield</th><th class="num">Swap Spread</th><th class="num">DV01 / $1mm Notional</th></tr></thead>
          <tbody>${swapRows}</tbody>
        </table>
      </div>
      <div class="callout" style="margin-top:10px;"><b>Why swap spreads are negative:</b> USD swap spreads have run structurally negative for years, most negative at the long end — dealer balance-sheet costs since 2008, heavy Treasury issuance cheapening Treasuries relative to swaps, and insurance/LDI accounts receiving fixed on swaps to hedge liabilities rather than buying long Treasuries. The spread levels here are illustrative (no free live feed), but the negative sign and the shape — more negative further out — are real and well-documented, not invented for this platform.</div>
      <div class="footnote" style="margin-top:6px;">Single-curve simplification: real swap desks discount off SOFR/OIS, not the Treasury curve. Fixed-leg DV01 approximated as a par bond with the same coupon/maturity — floating-leg DV01 ≈0 for a just-reset swap, the standard textbook shortcut.</div>
    </div>

    <div>
      <div class="section-label">Portfolio DV01 Hedge Calculator</div>
      <div class="grid4">
        <div class="stat-card hero"><div class="stat-label">Current Portfolio DV01</div><div class="stat-value">${money(dollarDV01)}</div><div class="stat-sub">per 1bp, from Portfolio &amp; Risk tab</div></div>
      </div>
      <div class="field-row" style="margin-top:12px;">
        <label>Hedge instrument</label>
        <select id="hedgeInstrument" onchange="renderHedgeResult()">
          <optgroup label="Futures">
            ${FUTURES_SPEC.map(s=>`<option value="fut:${s.id}">${s.id} — ${s.label}</option>`).join('')}
          </optgroup>
          <optgroup label="Swaps">
            ${SWAP_TENORS.map(t=>`<option value="swap:${t}">${t}Y Swap</option>`).join('')}
          </optgroup>
        </select>
        <label>Hedge ratio</label>
        <input type="number" id="hedgeRatio" value="100" min="0" max="200" step="10" style="width:70px;" onchange="renderHedgeResult()"> %
      </div>
      <div id="hedgeResult" style="margin-top:12px;"></div>
    </div>

    ${explainerBox(`Everything on the Portfolio &amp; Risk and Scenarios tabs <b>measures</b> rate risk — this tab is the other half: how a real desk actually <b>manages</b> it without unwinding the underlying bonds. Selling Treasury futures or paying fixed on a swap both reduce net DV01; the hedge calculator sizes either to your actual portfolio exposure. A 100% hedge ratio targets flat DV01 — a real desk rarely runs exactly flat, but knowing the size of a full hedge is the starting point for deciding how much risk to actually carry.`)}
  `;
  renderHedgeResult();
}

function renderHedgeResult(){
  const el = document.getElementById('hedgeResult');
  if(!el) return;
  const instrumentVal = document.getElementById('hedgeInstrument').value;
  const ratioPct = parseFloat(document.getElementById('hedgeRatio').value) || 0;
  const p = computePortfolio();
  const dollarDV01 = portfolioValue * p.wDV01 / 100;
  const targetHedgeDV01 = dollarDV01 * (ratioPct/100);

  let resultHtml = '';
  if(instrumentVal.startsWith('fut:')){
    const id = instrumentVal.split(':')[1];
    const spec = FUTURES_SPEC.find(s=>s.id===id);
    const f = futuresContractDV01(spec);
    const contracts = -targetHedgeDV01 / f.futuresDV01PerContract;
    // contracts is the SIGNED futures position needed: negative = short (sell), positive = long (buy) —
    // a positive portfolio DV01 (long duration) needs a negative/short futures position to offset it.
    const direction = contracts < 0 ? 'Sell' : 'Buy';
    resultHtml = `
      <div class="grid4">
        <div class="stat-card hero"><div class="stat-label">Contracts</div><div class="stat-value">${Math.abs(contracts).toFixed(1)}</div><div class="stat-sub">${direction} ${spec.id} to hedge</div></div>
        <div class="stat-card"><div class="stat-label">DV01 / Contract</div><div class="stat-value">$${f.futuresDV01PerContract.toFixed(0)}</div></div>
        <div class="stat-card"><div class="stat-label">Notional Hedged</div><div class="stat-value">${money(Math.abs(contracts)*spec.notional)}</div><div class="stat-sub">face value, ${spec.notional.toLocaleString()}/contract</div></div>
        <div class="stat-card"><div class="stat-label">Target Hedge DV01</div><div class="stat-value">${money(targetHedgeDV01)}</div></div>
      </div>
    `;
  } else {
    const tenor = parseInt(instrumentVal.split(':')[1]);
    const dv01_1mm = swapDV01Per1mm(tenor);
    const notionalNeeded = -targetHedgeDV01 / dv01_1mm * 1000000;
    // notionalNeeded is signed as a receive-fixed position: negative means the hedge is actually
    // pay-fixed — a positive portfolio DV01 (long duration) needs to pay fixed to offset it.
    const direction = notionalNeeded < 0 ? 'Pay fixed' : 'Receive fixed';
    resultHtml = `
      <div class="grid4">
        <div class="stat-card hero"><div class="stat-label">Swap Notional</div><div class="stat-value">${money(Math.abs(notionalNeeded))}</div><div class="stat-sub">${direction}, ${tenor}Y</div></div>
        <div class="stat-card"><div class="stat-label">DV01 / $1mm</div><div class="stat-value">$${dv01_1mm.toFixed(0)}</div></div>
        <div class="stat-card"><div class="stat-label">Par Fixed Rate</div><div class="stat-value">${pct(swapParRate(tenor),3)}</div></div>
        <div class="stat-card"><div class="stat-label">Target Hedge DV01</div><div class="stat-value">${money(targetHedgeDV01)}</div></div>
      </div>
    `;
  }
  el.innerHTML = resultHtml + `<div class="footnote" style="margin-top:8px;">A long-duration portfolio (positive DV01) needs to <b>sell</b> futures or <b>pay fixed</b> on a swap to hedge — both lose money if rates fall, offsetting the bonds' gain, and vice versa. This calculator sizes the trade; it doesn't place it.</div>`;
}

/* =========================================================================
   NAV / PAGE SWITCH
   ========================================================================= */
const PAGE_META = {
  dashboard: { heading:'Dashboard', sub: 'Today\'s curve and bond watchlist' },
  valuation: { heading:'Bond Valuation', sub: 'Price, yield, duration, convexity, and spread — computed live' },
  curve: { heading:'Yield Curve', sub: 'Par curve, bootstrapped zero curve, forwards, and shape signals' },
  portfolio: { heading:'Portfolio & Risk', sub: 'Weighted YTM, duration, DV01, convexity, and VaR' },
  scenarios: { heading:'Scenarios', sub: 'Macro-driven yield scenarios and curve shocks, translated to price' },
  comparison: { heading:'Comparison', sub: 'Side-by-side fundamentals and relative value across a peer set' },
  derivatives: { heading:'Derivatives', sub: 'Treasury futures, swap rates, and a portfolio DV01 hedge calculator' },
};

function showPage(key){
  Object.keys(PAGE_META).forEach(k=>{
    document.getElementById('page-'+k).style.display = (k===key) ? 'flex' : 'none';
  });
  document.querySelectorAll('.nav-link').forEach(el=>{
    el.classList.toggle('active', el.dataset.page === key);
  });
  document.getElementById('pageHeading').textContent = PAGE_META[key].heading;
  document.getElementById('pageSub').textContent = PAGE_META[key].sub;

  if(key==='dashboard') renderDashboard();
  if(key==='valuation') renderValuationPage();
  if(key==='curve') renderCurvePage();
  if(key==='portfolio') renderPortfolioPage();
  if(key==='scenarios') renderScenariosPage();
  if(key==='comparison') renderComparisonPage();
  if(key==='derivatives') renderDerivativesPage();
}

/* =========================================================================
   INIT
   ========================================================================= */
renderTicker();
showPage('dashboard');
</script>
